<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广州应用科技学院 - 个人信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        h1 {
            font-size: 24px;
            color: #1a237e;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px solid #3f51b5;
            text-align: center;
        }
        .info-grid {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #e0e0e0;
            gap: 12px;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
            font-weight: 500;
            flex-shrink: 0;
        }
        .info-value {
            color: #1a237e;
            font-weight: 600;
            text-align: right;
        }
        .calc-section {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 20px;
        }
        .calc-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .input-group label {
            white-space: nowrap;
            line-height: 42px;
            color: #555;
            font-weight: 500;
        }
        .input-group input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3f51b5;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #3f51b5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.15s;
        }
        .btn:hover {
            background: #303f9f;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .result {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            background: #f0f0f0;
            color: #888;
            transition: all 0.3s;
        }
        .result.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .result.error {
            background: #ffebee;
            color: #c62828;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }

        /* ===== 自适应：平板 ===== */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 24px;
                border-radius: 12px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 18px;
                padding-bottom: 12px;
            }
            .info-grid,
            .calc-section {
                padding: 16px;
            }
            .info-item {
                padding: 8px 0;
            }
        }

        /* ===== 自适应：手机 ===== */
        @media (max-width: 420px) {
            body {
                padding: 8px;
                align-items: flex-start;
                padding-top: 40px;
            }
            .card {
                padding: 18px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .card:hover {
                transform: none;
            }
            h1 {
                font-size: 17px;
                margin-bottom: 14px;
                padding-bottom: 10px;
            }
            .info-grid,
            .calc-section {
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 18px;
            }
            .info-item {
                padding: 7px 0;
                font-size: 14px;
            }
            .info-label {
                font-size: 13px;
            }
            .info-value {
                font-size: 14px;
            }
            .calc-section h2 {
                font-size: 14px;
                margin-bottom: 12px;
            }

            /* 输入框在手机上可上下排 */
            .input-group {
                flex-direction: column;
                gap: 6px;
            }
            .input-group label {
                line-height: 1.4;
                font-size: 14px;
            }
            .input-group input {
                width: 100%;
                padding: 12px 14px;
                font-size: 16px; /* 防止iOS自动缩放 */
            }

            .btn {
                padding: 14px;
                font-size: 15px;
                border-radius: 8px;
            }

            .result {
                margin-top: 12px;
                padding: 12px 14px;
                font-size: 14px;
            }
            .footer {
                font-size: 11px;
                margin-top: 14px;
            }
        }

        /* ===== 自适应：小屏手机（如 iPhone SE） ===== */
        @media (max-width: 360px) {
            body {
                padding: 4px;
                padding-top: 24px;
            }
            .card {
                padding: 14px;
                border-radius: 8px;
            }
            h1 {
                font-size: 15px;
            }
            .info-item {
                font-size: 13px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .info-value {
                text-align: left;
            }
        }

        /* ===== 自适应：大屏优化 ===== */
        @media (min-width: 768px) {
            .card {
                padding: 48px;
                max-width: 560px;
            }
            h1 {
                font-size: 26px;
            }
        }

        @media (min-width: 1200px) {
            .card {
                max-width: 600px;
                padding: 56px;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>广州应用科技学院 - 个人信息</h1>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">姓名</span>
                <span class="info-value">张三</span>
            </div>
            <div class="info-item">
                <span class="info-label">专业</span>
                <span class="info-value">计算机科学与技术</span>
            </div>
            <div class="info-item">
                <span class="info-label">基础学分</span>
                <span class="info-value" id="baseScore">80 分</span>
            </div>
        </div>

        <div class="calc-section">
            <h2>📊 学分计算器</h2>
            <div class="input-group">
                <label for="bonusInput">加分：</label>
                <input type="number" id="bonusInput" placeholder="请输入加分数" min="0">
            </div>
            <button class="btn" id="calcBtn">点击计算总分</button>
            <div class="result" id="resultDisplay">预估总分：等待计算</div>
        </div>

        <div class="footer">Web 前端开发实验 · 2026</div>
    </div>

    <script>
        const BASE_SCORE = 80;
        const bonusInput = document.getElementById('bonusInput');
        const calcBtn = document.getElementById('calcBtn');
        const resultDisplay = document.getElementById('resultDisplay');

        calcBtn.addEventListener('click', function () {
            const rawValue = bonusInput.value.trim();
            if (rawValue === '') {
                resultDisplay.textContent = '⚠️ 请输入加分数';
                resultDisplay.className = 'result error';
                return;
            }

            const bonus = Number(rawValue);
            if (isNaN(bonus) || bonus < 0) {
                resultDisplay.textContent = '⚠️ 请输入有效的非负数字';
                resultDisplay.className = 'result error';
                return;
            }

            const total = BASE_SCORE + bonus;
            resultDisplay.textContent = `计算成功！预估总分为：${total} 分`;
            resultDisplay.className = 'result success';
        });
    </script>
</body>
</html>
