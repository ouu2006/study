<!DOCTYPE html>
<html>
    <head>
        <title>个人信息</title>
    </head>
    <body>
        <h1>广州应用科技学院 - 个人信息</h1>
        <p>姓名：嚄u</p>
        <p>专业：计算机科学与技术</p>
        <p>基础学分：80 分</p>
        <input type="text" id="bonusInput" placeholder="请输入加分">
        <button onclick="calculateTotal()">计算总分</button>
        <p id="result">预估总分：等待计算</p>
        <script>
            function calculateTotal() {
                var bonus = parseFloat(document.getElementById('bonusInput').value);
                if (isNaN(bonus)) {
                    document.getElementById('result').innerText = '请输入有效的数字！';
                } else {
                    var total = 80 + bonus;
                    document.getElementById('result').innerText = '计算成功！预估总分为：' + total + ' 分';
                }
            }
        </script>
    </body>
</html>
